version: 2
updates:
  # Python dependencies for the Coöperatieve Vereniging app
  - package-ecosystem: "pip"
    directory: "/apps/cooperatie"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "cooperatie"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci/cd"
