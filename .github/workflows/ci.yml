name: CI - Code Quality & Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-cooperatie:
    name: Test Coöperatieve App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "apps/cooperatie/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/cooperatie/requirements.txt
          pip install pytest flake8

      - name: Lint with flake8
        run: |
          flake8 apps/cooperatie --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 apps/cooperatie --count --exit-zero --max-complexity=10 --max-line-length=130 --statistics

      - name: Run Pytest
        run: |
          PYTHONPATH=. pytest apps/cooperatie/tests -v

  test-vve:
    name: Test VvE App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "apps/vve/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/vve/requirements.txt
          pip install pytest flake8

      - name: Lint with flake8
        run: |
          flake8 apps/vve --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 apps/vve --count --exit-zero --max-complexity=10 --max-line-length=130 --statistics

      - name: Run Pytest
        run: |
          PYTHONPATH=. pytest apps/vve/tests -v
