name: CD - Deploy naar Google Cloud & Firebase

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Maakt handmatig triggeren in GitHub mogelijk

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "apps/cooperatie/requirements.txt"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r apps/cooperatie/requirements.txt
          pip install pytest

      - name: Run Pytest
        run: |
          PYTHONPATH=. pytest -v

  deploy-cloud-run:
    name: Deploy to Cloud Run & Firebase
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    env:
      REGION: europe-west4
      SERVICE_NAME: cooperatie-service
      REPOSITORY_NAME: contact-manager

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Google Cloud Authenticatie
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configureer Docker voor Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Bouw en tag Docker Image
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/cooperatie-app:${{ github.sha }}"
          LATEST_TAG="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/cooperatie-app:latest"
          
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" -f apps/cooperatie/Dockerfile .
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy naar Google Cloud Run
        id: deploy-run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_TAG }}
          flags: >-
            --allow-unauthenticated
            --min-instances=0
            --max-instances=2
            --memory=512Mi
            --cpu=1
            --set-env-vars=USE_FIRESTORE=true,FIRESTORE_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},FIRESTORE_COLLECTION=cooperatie_contacten

      - name: Installeer Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            firebase deploy --only hosting --project ${{ secrets.GCP_PROJECT_ID }} --token "$FIREBASE_TOKEN"
          else
            echo "FIREBASE_TOKEN niet ingesteld; hosting overgeslagen (Cloud Run service is direct live via: ${{ steps.deploy-run.outputs.url }})"
          fi
