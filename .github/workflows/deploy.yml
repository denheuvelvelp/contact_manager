name: CD - Deploy naar Google Cloud & Firebase

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run All Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "apps/cooperatie/requirements.txt"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r apps/cooperatie/requirements.txt
          pip install -r apps/vve/requirements.txt
          pip install pytest

      - name: Run Pytest
        run: |
          PYTHONPATH=. pytest -v

  deploy-cloud-run:
    name: Deploy to Cloud Run & Firebase
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    env:
      REGION: europe-west4
      REPOSITORY_NAME: contact-manager

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Google Cloud Authenticatie
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configureer Docker voor Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # --- 1. Bouw en Deploy Coöperatieve App ---
      - name: Bouw Coöperatieve Container Image
        run: |
          IMAGE_COOP="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/cooperatie-app:${{ github.sha }}"
          LATEST_COOP="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/cooperatie-app:latest"
          
          docker build -t "$IMAGE_COOP" -t "$LATEST_COOP" -f apps/cooperatie/Dockerfile .
          docker push "$IMAGE_COOP"
          docker push "$LATEST_COOP"
          echo "IMAGE_COOP=$IMAGE_COOP" >> $GITHUB_ENV

      - name: Deploy Coöperatieve Service naar Cloud Run
        id: deploy-coop
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: cooperatie-service
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_COOP }}
          flags: >-
            --allow-unauthenticated
            --min-instances=0
            --max-instances=2
            --memory=512Mi
            --cpu=1
            --set-env-vars=USE_FIRESTORE=true,FIRESTORE_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},FIRESTORE_COLLECTION=cooperatie_contacten,GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }},GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }},ALLOWED_DOMAIN=denheuvelvelp.nl,GOOGLE_WORKSPACE_ADMIN_EMAIL=${{ secrets.GOOGLE_WORKSPACE_ADMIN_EMAIL || 'alberdao@denheuvelvelp.nl' }},GOOGLE_WORKSPACE_CREDENTIALS_JSON=${{ secrets.GOOGLE_WORKSPACE_CREDENTIALS_JSON }},GOOGLE_WORKSPACE_DOMAIN=denheuvelvelp.nl

      # --- 2. Bouw en Deploy VvE App ---
      - name: Bouw VvE Container Image
        run: |
          IMAGE_VVE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/vve-app:${{ github.sha }}"
          LATEST_VVE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/vve-app:latest"
          
          docker build -t "$IMAGE_VVE" -t "$LATEST_VVE" -f apps/vve/Dockerfile .
          docker push "$IMAGE_VVE"
          docker push "$LATEST_VVE"
          echo "IMAGE_VVE=$IMAGE_VVE" >> $GITHUB_ENV

      - name: Deploy VvE Service naar Cloud Run
        id: deploy-vve
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: vve-service
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_VVE }}
          flags: >-
            --allow-unauthenticated
            --min-instances=0
            --max-instances=2
            --memory=512Mi
            --cpu=1
            --set-env-vars=USE_FIRESTORE=true,FIRESTORE_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},FIRESTORE_COLLECTION=vve_contacten,GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }},GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }},ALLOWED_DOMAIN=denheuvelvelp.nl,GOOGLE_WORKSPACE_ADMIN_EMAIL=${{ secrets.GOOGLE_WORKSPACE_ADMIN_EMAIL || 'alberdao@denheuvelvelp.nl' }},GOOGLE_WORKSPACE_CREDENTIALS_JSON=${{ secrets.GOOGLE_WORKSPACE_CREDENTIALS_JSON }},GOOGLE_WORKSPACE_DOMAIN=denheuvelvelp.nl

      - name: Deployment URLs Overzicht
        run: |
          echo "=========================================================="
          echo " Coöperatieve App URL: ${{ steps.deploy-coop.outputs.url }}"
          echo " VvE App URL:          ${{ steps.deploy-vve.outputs.url }}"
          echo "=========================================================="

      # --- 3. Firebase Hosting (Optioneel) ---
      - name: Deploy Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            npm install -g firebase-tools
            firebase deploy --only hosting --project ${{ secrets.GCP_PROJECT_ID }} --token "$FIREBASE_TOKEN"
          else
            echo "FIREBASE_TOKEN niet ingesteld; hosting overgeslagen. Cloud Run services zijn direct bereikbaar via de bovenstaande URLs."
          fi
