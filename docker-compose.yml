version: '3.8'

services:
  cooperatie-app:
    build:
      context: .
      dockerfile: apps/cooperatie/Dockerfile
    container_name: cooperatie_contact_manager
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - USE_FIRESTORE=false
      - SQLITE_DB_PATH=/app/local_data/cooperatie_contacts.db
    volumes:
      - ./local_data:/app/local_data
      - ./apps/cooperatie:/app/apps/cooperatie
    restart: unless-stopped

